name: Build Rolling Images

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  push:
    branches:
    - master
    paths:
    - 'Dockerfile'
    - '.dockerignore'
    - 'root/**'
    - '.github/workflows/image.yaml'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  image: plexinc/pms-docker

jobs:
  build:
    name: Build ${{ matrix.channel }}
    runs-on: ubuntu-latest
    # Docker Hub credentials live in this environment, which only master can deploy to
    environment: dockerhub
    strategy:
      fail-fast: false
      matrix:
        include:
        # plexpass has always been an alias of beta
        - channel: beta
          tags: |
            plexinc/pms-docker:beta
            plexinc/pms-docker:plexpass
        - channel: public
          tags: |
            plexinc/pms-docker:public
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Docker Metadata
      id: meta
      uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5.10.0
      with:
        images: |
          ${{ env.image }}
        labels: |
          org.opencontainers.image.vendor=Plex, GmbH
          org.opencontainers.image.source=https://github.com/plexinc/pms-docker
          org.opencontainers.image.title=Plex Media Server
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.version=${{ matrix.channel }}
          org.opencontainers.image.description=The Plex Media Server

    - name: Login to Dockerhub
      uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef  # v3.6.0
      with:
        username: ${{ vars.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Docker Setup QEMU
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0

    - name: Docker Setup Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

    - name: Build and Push
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
      with:
        context: .
        push: true
        provenance: false
        sbom: false
        platforms: linux/amd64,linux/arm64,linux/arm/v7
        build-args: |
          TAG=${{ matrix.channel }}
        labels: ${{ steps.meta.outputs.labels }}
        tags: ${{ matrix.tags }}
